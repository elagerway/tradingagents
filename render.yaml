services:
  - type: web
    name: tradingagents-api
    runtime: docker
    region: oregon
    plan: starter
    rootDir: .
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: USE_FAKE_ENGINE
        value: "1"
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"

  - type: cron
    name: tradingagents-janitor
    runtime: docker
    region: oregon
    plan: starter
    schedule: "*/5 * * * *"
    rootDir: .
    dockerfilePath: apps/api/Dockerfile
    dockerCommand: python -m api.janitor
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STUCK_RUN_THRESHOLD_MINUTES
        value: "30"
