# =============================================================================
# render.yaml — Render Blueprint for the FastAPI engine service
# =============================================================================
#
# Status: PLACEHOLDER. Populated for real in Plan 2 (apps/api/ implementation).
#
# How Render Blueprints work:
#   1. Commit this file to the repo's main branch.
#   2. In the Render dashboard: New -> Blueprint -> point at this repo.
#   3. Render reads this file and provisions the declared services.
#   4. Future commits that change render.yaml are picked up automatically.
#
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # tradingagents-api
  # ---------------------------------------------------------------------------
  # FastAPI service hosting the LangGraph engine. Runs on a single instance
  # for the closed beta; scaling is a Plan 4 / future concern.
  - type: web
    name: tradingagents-api
    runtime: docker
    region: oregon                     # change to your preferred Render region
    plan: starter                      # $7/mo; size up if multi-agent runs need more RAM
    rootDir: apps/api                  # populated in Plan 2
    dockerfilePath: ./Dockerfile       # apps/api/Dockerfile — created in Plan 2
    healthCheckPath: /healthz          # implemented in Plan 2 task
    autoDeploy: true                   # deploy on every push to main

    # Environment variables. Values are NOT committed — they're set in Render's
    # dashboard (Service -> Environment) or via the Render API. We reference
    # them here so Render knows which keys must exist.
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: USE_FAKE_ENGINE
        value: "0"                     # "1" only on preview/CI, never on prod
      - key: PYTHON_VERSION
        value: "3.13"

    # Render injects PORT; FastAPI must bind to it. The Dockerfile's CMD will
    # honor this (uvicorn --host 0.0.0.0 --port $PORT).

