name: API CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'tradingagents/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'

jobs:
  pytest:
    name: pytest (apps/api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Lint
        working-directory: apps/api
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests
        working-directory: apps/api
        env:
          SUPABASE_URL: http://test.local
          SUPABASE_SERVICE_ROLE_KEY: test-srv
          SUPABASE_JWT_SECRET: test-secret-do-not-use-in-prod
          USE_FAKE_ENGINE: "1"
        run: uv run pytest -v

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: pytest
    # Only deploy on push to main (not PRs). Skip if pytest didn't run on this event.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_WEB_SERVICE_ID: srv-d7qf2g4m0tmc73eli8m0
      RENDER_CRON_SERVICE_ID: crn-d7qf2id7vvec73da5ugg
    steps:
      - name: Trigger Render web service deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          DEPLOY_ID=$(curl -fsSL -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID/deploys" \
            | jq -r '.id')
          echo "Triggered web deploy: $DEPLOY_ID"
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
        id: web

      - name: Trigger Render cron service deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          DEPLOY_ID=$(curl -fsSL -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_CRON_SERVICE_ID/deploys" \
            | jq -r '.id')
          echo "Triggered cron deploy: $DEPLOY_ID"

      - name: Wait for web deploy to be live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.web.outputs.DEPLOY_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            STATE=$(curl -fsSL \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_WEB_SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')
            echo "[$i/30] state=$STATE"
            case "$STATE" in
              live) echo "Deploy live"; exit 0 ;;
              build_failed|update_failed|deactivated|canceled)
                echo "Deploy failed: $STATE"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for live state"
          exit 1
